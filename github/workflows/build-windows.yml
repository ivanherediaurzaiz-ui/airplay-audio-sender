name: Compilar AirPlayAudioSender.exe

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar el ejecutable portable
        run: |
          pyinstaller --onefile --console --name AirPlayAudioSender app.py

      - name: Publicar el .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: AirPlayAudioSender-windows
          path: dist/AirPlayAudioSender.exe
